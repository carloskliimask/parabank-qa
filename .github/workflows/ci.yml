name: QA checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: parasoft/parabank
          path: parabank
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: automation/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: parabank/pom.xml

      - name: Build ParaBank WAR
        working-directory: parabank
        run: mvn -B -DskipTests package

      - name: Prepare ParaBank WAR for Docker
        working-directory: parabank
        run: |
          war=$(find target -maxdepth 1 -type f -name '*.war' | head -n 1)
          cp "$war" target/parabank.war

      - name: Start ParaBank
        run: |
          docker build -t parabank-ci ./parabank
          docker run --detach --name parabank-ci --publish 127.0.0.1:8080:8080 parabank-ci

      - name: Initialize ParaBank and wait for API
        run: |
          initialized=false
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/parabank/initializeDB.htm >/dev/null; then
              initialized=true
              break
            fi
            sleep 2
          done
          if [ "$initialized" != true ]; then
            docker logs parabank-ci
            exit 1
          fi
          for attempt in {1..60}; do
            if curl --fail --silent --user john:demo --header 'Accept: application/json' \
              http://127.0.0.1:8080/parabank/services/bank/accounts/12345 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs parabank-ci
          exit 1

      - name: Install automation dependencies
        working-directory: automation
        run: npm ci

      - name: Install Chromium
        working-directory: automation
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        working-directory: automation
        run: npm run typecheck

      - name: Run Playwright UI tests
        working-directory: automation
        run: npm test

      - name: Run Postman API collection with Newman
        working-directory: automation
        run: npm run test:api

      - name: Generate Allure HTML report
        if: always()
        working-directory: automation
        run: |
          if [ -d allure-results ]; then
            npx allure generate allure-results --clean -o allure-report
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-report
          path: automation/allure-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop ParaBank container
        if: always()
        run: docker rm --force parabank-ci 2>/dev/null || true
